<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เต็นท์ไพ่ทาโร่ของแม่หมอ</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Charm:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="curtain"><div class="pn l"></div><div class="pn r"></div>
<div id="enter"><h1>เต็นท์ไพ่ทาโร่</h1><p>ม่านกำลังรอให้คุณเปิดเข้าไป</p><button id="go">เปิดม่านเข้าเต็นท์</button></div></div>

<filter id="gw" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<path d="M12 190Q18 106 100 96Q182 106 188 190Z" fill="url(#cl)"/>
<path d="M60 190Q100 122 140 190Z" fill="#160a2b"/>

<path d="M82 68Q89 62 96 68Q89 72 82 68Z" fill="#ffe7a8"/><path d="M104 68Q111 62 118 68Q111 72 104 68Z" fill="#ffe7a8"/>
<path d="M72 80Q100 96 128 80Q128 98 100 106Q72 98 72 80Z" fill="#6a3fb0"/><path d="M72 80Q100 96 128 80" stroke="#f2c66d" stroke-width="1.5" fill="none"/>
<path d="M100 24l4 7-4 7-4-7z" fill="#f2c66d"/>
<ellipse cx="60" cy="152" rx="20" ry="13" fill="#2c1552" transform="rotate(-20 60 152)"/><ellipse cx="140" cy="152" rx="20" ry="13" fill="#2c1552" transform="rotate(20 140 152)"/>
<circle cx="100" cy="150" r="30" fill="#b9a4ff" opacity=".35" filter="url(#gw)" class="gl"/>
<circle cx="100" cy="150" r="24" fill="url(#bl)"/><path d="M84 152Q96 140 108 150T116 156" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none"/>
<ellipse cx="78" cy="160" rx="7" ry="5" fill="#d9b48f"/><ellipse cx="122" cy="160" rx="7" ry="5" fill="#d9b48f"/>
</svg>
<div id="tools"><button class="pill" id="bk">📖 ความหมายไพ่</button></div>
<div id="bubble"></div>
<section id="table"><div id="zone"></div></section>
<div id="read" class="hide"></div>
</main>

<section id="pickv" class="ov hide"><header><button class="pill" id="pback">← กลับ</button><b id="pcount"></b></header>
<p class="hint">ตั้งจิตนึกถึงเรื่องที่อยากรู้ แล้วแตะไพ่ที่ใจเรียกหา (แตะซ้ำเพื่อยกเลิก)</p><div id="pgrid"></div>
<div class="bar"><button class="pill big" id="pgo" disabled>🔮 เปิดไพ่ที่เลือก</button></div></section>
<section id="cardsv" class="ov hide"><header><button class="pill" id="cback">← กลับเต็นท์</button><h2>📖 ความหมายไพ่ Major Arcana 22 ใบ</h2></header><div id="cgrid"></div></section>
